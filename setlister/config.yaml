name: Setlister
version: "0.4.3"
slug: setlister
description: Kapelní repertoár, setlisty, tisk a read-only asistent nad kapelními Gmaily.
url: https://github.com/hanych420/setlister
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
ports:
  "8110/tcp": 8110
ports_description:
  "8110/tcp": Webové rozhraní Setlisteru
webui: http://[HOST]:[PORT:8110]/
watchdog: http://[HOST]:[PORT:8110]/api/health
backup: cold
environment:
  SETLISTER_HOST: 0.0.0.0
  SETLISTER_PORT: "8110"
  SETLISTER_DATA_DIR: /data
options:
  base_url: https://setlister.cz
  admin_email: propadleek@gmail.com
  admin_history_pin: "0000"
  google_client_id: ""
  google_client_secret: ""
  openai_api_key: ""
  openai_model: gpt-6-luna
  cloudflare_access_team: ""
  cloudflare_access_aud: ""
  gmail_lookback_days: 730
schema:
  base_url: str
  admin_email: str
  admin_history_pin: password
  google_client_id: str
  google_client_secret: password
  openai_api_key: password
  openai_model: str
  cloudflare_access_team: str
  cloudflare_access_aud: str
  gmail_lookback_days: int(30,3650)
